name: Repository quality

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source syntax, local documentation links and conflict markers
        run: python tools/check_repository.py
      - name: Check Python correctness
        run: |
          python -m pip install ruff==0.11.13
          ruff check .
