<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#57d7d0"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#081321"/><text x="42" y="52" font-family="Arial,sans-serif" font-size="29" fill="#f4f8fd" font-weight="700">AURA / I2S WIRING REFERENCE</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="17" fill="#9aafc7" font-weight="400">Raspberry Pi 4 + INMP441 + MAX98357A. Logical connections; not a photograph of the build.</text><rect x="42" y="122" width="330" height="84" rx="16" fill="#112236" stroke="#2ed2cd" stroke-width="2"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="23" fill="#f4f8fd" font-weight="700">INMP441 microphone</text><text x="64" y="190" font-family="Arial,sans-serif" font-size="16" fill="#9aafc7" font-weight="400">3.3 V logic and power</text><rect x="416" y="122" width="330" height="84" rx="16" fill="#112236" stroke="#2ed2cd" stroke-width="2"/><text x="438" y="160" font-family="Arial,sans-serif" font-size="23" fill="#f4f8fd" font-weight="700">Raspberry Pi 4</text><text x="438" y="190" font-family="Arial,sans-serif" font-size="16" fill="#9aafc7" font-weight="400">40-pin header / BCM + physical pin</text><rect x="790" y="122" width="330" height="84" rx="16" fill="#112236" stroke="#2ed2cd" stroke-width="2"/><text x="812" y="160" font-family="Arial,sans-serif" font-size="23" fill="#f4f8fd" font-weight="700">MAX98357A amplifier</text><text x="812" y="190" font-family="Arial,sans-serif" font-size="16" fill="#9aafc7" font-weight="400">5 V VIN / 3.3 V I2S signals</text><rect x="416" y="224" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="249" font-family="Arial,sans-serif" font-size="19" fill="#f8be64" font-weight="700">3.3 V  /  pin 1</text><text x="62" y="249" font-family="Arial,sans-serif" font-size="21" fill="#f8be64" font-weight="700">VDD</text><path d="M220 242 H410" stroke="#f8be64" stroke-width="3"/><rect x="416" y="277" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="302" font-family="Arial,sans-serif" font-size="19" fill="#90a3b7" font-weight="700">GND  /  pin 6</text><text x="62" y="302" font-family="Arial,sans-serif" font-size="21" fill="#90a3b7" font-weight="700">GND + L/R</text><path d="M220 295 H410" stroke="#90a3b7" stroke-width="3"/><path d="M752 295 H860" stroke="#90a3b7" stroke-width="3"/><text x="875" y="302" font-family="Arial,sans-serif" font-size="21" fill="#90a3b7" font-weight="700">GND</text><rect x="416" y="330" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="355" font-family="Arial,sans-serif" font-size="19" fill="#5ce1c5" font-weight="700">GPIO18  /  pin 12</text><text x="62" y="355" font-family="Arial,sans-serif" font-size="21" fill="#5ce1c5" font-weight="700">SCK</text><path d="M220 348 H410" stroke="#5ce1c5" stroke-width="3"/><path d="M752 348 H860" stroke="#5ce1c5" stroke-width="3"/><text x="875" y="355" font-family="Arial,sans-serif" font-size="21" fill="#5ce1c5" font-weight="700">BCLK</text><rect x="416" y="383" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="408" font-family="Arial,sans-serif" font-size="19" fill="#80a9ff" font-weight="700">GPIO19  /  pin 35</text><text x="62" y="408" font-family="Arial,sans-serif" font-size="21" fill="#80a9ff" font-weight="700">WS</text><path d="M220 401 H410" stroke="#80a9ff" stroke-width="3"/><path d="M752 401 H860" stroke="#80a9ff" stroke-width="3"/><text x="875" y="408" font-family="Arial,sans-serif" font-size="21" fill="#80a9ff" font-weight="700">LRC / LRCLK</text><rect x="416" y="436" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="461" font-family="Arial,sans-serif" font-size="19" fill="#e3a6ff" font-weight="700">GPIO20  /  pin 38</text><text x="62" y="461" font-family="Arial,sans-serif" font-size="21" fill="#e3a6ff" font-weight="700">SD → Pi</text><path d="M220 454 H410" stroke="#e3a6ff" stroke-width="3"/><rect x="416" y="489" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="514" font-family="Arial,sans-serif" font-size="19" fill="#f596b9" font-weight="700">GPIO21  /  pin 40</text><path d="M752 507 H860" stroke="#f596b9" stroke-width="3"/><text x="875" y="514" font-family="Arial,sans-serif" font-size="21" fill="#f596b9" font-weight="700">DIN ← Pi</text><rect x="416" y="542" width="330" height="40" rx="9" fill="#15283d"/><text x="446" y="567" font-family="Arial,sans-serif" font-size="19" fill="#f8be64" font-weight="700">5 V  /  pin 2</text><path d="M752 560 H860" stroke="#f8be64" stroke-width="3"/><text x="875" y="567" font-family="Arial,sans-serif" font-size="21" fill="#f8be64" font-weight="700">VIN</text><rect x="42" y="644" width="1078" height="142" rx="16" fill="#112236"/><text x="64" y="678" font-family="Arial,sans-serif" font-size="22" fill="#f4f8fd" font-weight="700">Before powering on</text><text x="64" y="708" font-family="Arial,sans-serif" font-size="18" fill="#d8e6f4" font-weight="400">Set microphone L/R to GND: the application reads the left channel.</text><text x="64" y="737" font-family="Arial,sans-serif" font-size="18" fill="#d8e6f4" font-weight="400">Connect the speaker only across amplifier + and −. Neither terminal goes to ground.</text><text x="64" y="766" font-family="Arial,sans-serif" font-size="18" fill="#d8e6f4" font-weight="400">Check your board’s SD / EN and GAIN settings. The voiceHAT overlay also reserves GPIO16.</text><text x="42" y="825" font-family="Arial,sans-serif" font-size="17" fill="#9aafc7" font-weight="400">HDMI carries video; USB carries touchscreen input. Use common ground and verify physical pin orientation.</text></svg>